apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-k8s
  namespace: ai-agents
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-k8s
  template:
    metadata:
      labels:
        app: mcp-k8s
    spec:
      serviceAccountName: ai-agent
      containers:
      - name: mcp
        image: ghcr.io/containers/kubernetes-mcp-server:latest
        args:
        - --read-only=true
        - --port=8080
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
