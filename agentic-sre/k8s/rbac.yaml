---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-agent
  namespace: ai-agents
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ai-agent-view
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "events", "configmaps", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ai-agent-view-binding
subjects:
- kind: ServiceAccount
  name: ai-agent
  namespace: ai-agents
roleRef:
  kind: ClusterRole
  name: ai-agent-view
  apiGroup: rbac.authorization.k8s.io
