apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-agent-api
  namespace: ai-agents
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-agent-api-reader
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "services", "configmaps", "namespaces"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-agent-api-reader
subjects:
  - kind: ServiceAccount
    name: k8s-agent-api
    namespace: ai-agents
roleRef:
  kind: ClusterRole
  name: k8s-agent-api-reader
  apiGroup: rbac.authorization.k8s.io
