apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sre-agent-ui
  namespace: ai-agents
spec:
  parentRefs:
    - name: cilium
      namespace: default
      sectionName: http
  hostnames:
    - "agent.cluster.home"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: sre-agent-ui
          port: 80
